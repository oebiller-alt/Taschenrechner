<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Taschenrechner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Taschenrechner</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
#app{width:min(100%,430px);padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);background:#000;display:flex;flex-direction:column;justify-content:flex-end;min-height:100vh;min-height:100dvh}
.display{height:28vh;min-height:150px;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 14px 12px;overflow:hidden}
.value{font-size:clamp(54px,17vw,76px);line-height:1;font-weight:300;letter-spacing:-3px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding-bottom:12px}
button{border:0;aspect-ratio:1;border-radius:50%;font:400 clamp(24px,7vw,30px)/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;background:#333;color:#fff;touch-action:manipulation}
button:active{filter:brightness(1.35);transform:scale(.97)}
.fn{background:#a5a5a5;color:#000}
.op{background:#ff9500}
.op.active{background:#fff;color:#ff9500}
.zero{grid-column:span 2;aspect-ratio:auto;border-radius:999px;text-align:left;padding-left:29px}
@media (orientation:landscape) and (max-height:500px){
 #app{max-width:700px}.display{height:42vh;min-height:100px}.grid{max-width:520px;margin-left:auto;margin-right:auto;width:100%}
}
</style>
</head>
<body>
<main id="app" aria-label="Taschenrechner">
  <div class="display"><div id="display" class="value" aria-live="polite">0</div></div>
  <div class="grid">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="sign">+/−</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="÷">÷</button>
    <button data-digit="7">7</button><button data-digit="8">8</button><button data-digit="9">9</button><button class="op" data-op="×">×</button>
    <button data-digit="4">4</button><button data-digit="5">5</button><button data-digit="6">6</button><button class="op" data-op="−">−</button>
    <button data-digit="1">1</button><button data-digit="2">2</button><button data-digit="3">3</button><button class="op" data-op="+">+</button>
    <button class="zero" data-digit="0">0</button><button data-action="decimal">,</button><button class="op" data-action="equals">=</button>
  </div>
</main>
<script>
(()=> {
 const root=document.getElementById('app'), display=document.getElementById('display');
 let current='0', values=[], operators=[], waiting=false, evaluated=false, lastOperator=null, lastValue=null;
 const ops=root.querySelectorAll('.op');

 function render(){
   let n=Number(current), s=current.replace('.',',');
   if(Number.isFinite(n) && s.replace(/[-,]/g,'').length>9) s=n.toPrecision(9).replace('.',',');
   display.textContent=s;
 }
 function resetOps(){ops.forEach(b=>b.classList.remove('active'))}
 function clear(){
   current='0'; values=[]; operators=[]; waiting=false; evaluated=false;
   lastOperator=null; lastValue=null; resetOps(); render();
 }
 function digit(d){
   if(waiting||evaluated){
     current=d; waiting=false; evaluated=false;
   } else {
     current=current==='0'?d:current+d;
   }
   render();
 }
 function decimal(){
   if(waiting||evaluated){
     current='0.'; waiting=false; evaluated=false;
   } else if(!current.includes('.')) {
     current+='.';
   }
   render();
 }
 function sign(){
   if(current!=='0') current=current[0]==='-'?current.slice(1):'-'+current;
   render();
 }
 function percent(){
   const n=Number(current);
   if(Number.isFinite(n)) current=String(n/100);
   render();
 }

 function precedence(op){return (op==='×'||op==='÷')?2:1}

 function evaluateExpression(){
   if(values.length===0) return Number(current);
   const nums=values.slice();
   nums.push(Number(current));
   const opers=operators.slice();

   // First resolve × and ÷, then + and −.
   const nums2=[nums[0]];
   const ops2=[];
   for(let i=0;i<opers.length;i++){
     const op=opers[i], b=nums[i+1];
     if(op==='×'||op==='÷'){
       const a=nums2.pop();
       const r=op==='×'?a*b:(b===0?NaN:a/b);
       nums2.push(r);
     } else {
       ops2.push(op);
       nums2.push(b);
     }
   }
   let result=nums2[0];
   for(let i=0;i<ops2.length;i++){
     result=ops2[i]==='+'?result+nums2[i+1]:result-nums2[i+1];
   }
   return result;
 }

 function choose(op){
   if(evaluated){
     values=[]; operators=[]; evaluated=false; lastOperator=null; lastValue=null;
   }
   if(!waiting){
     values.push(Number(current));
   }
   // If an operator is changed before entering the next number, replace it.
   if(waiting){
     if(operators.length) operators[operators.length-1]=op;
   } else {
     operators.push(op);
   }
   waiting=true;
   resetOps();
   const active=[...ops].find(b=>b.dataset.op===op);
   if(active) active.classList.add('active');
   render();
 }


 function equals(){
   if(evaluated){
     if(lastOperator!==null && lastValue!==null){
       const a=Number(current);
       const b=lastValue;
       let r;
       if(lastOperator==='+') r=a+b;
       else if(lastOperator==='−') r=a-b;
       else if(lastOperator==='×') r=a*b;
       else r=b===0?NaN:a/b;
       current=Number.isFinite(r)?String(r):'0';
     }
     render(); return;
   }
   if(operators.length===0){render();return}
   // Preserve the final operator and its right-hand operand for repeated "=".
   lastOperator=operators[operators.length-1] || null;
   lastValue=Number(current);
   const result=evaluateExpression();
   current=Number.isFinite(result)?String(result):'0';
   values=[]; operators=[]; waiting=false; evaluated=true; resetOps(); render();
 }

 root.addEventListener('click',e=>{
   const b=e.target.closest('button'); if(!b)return;
   if(b.dataset.digit!==undefined) digit(b.dataset.digit);
   else if(b.dataset.action==='decimal') decimal();
   else if(b.dataset.action==='clear') clear();
   else if(b.dataset.action==='sign') sign();
   else if(b.dataset.action==='percent') percent();
   else if(b.dataset.action==='equals') equals();
   else if(b.dataset.op) choose(b.dataset.op);
 });

 window.addEventListener('keydown',e=>{
   if(/^[0-9]$/.test(e.key)) digit(e.key);
   else if(e.key==='.'||e.key===',') decimal();
   else if(e.key==='Enter'||e.key==='=') equals();
   else if(e.key==='Escape') clear();
   else if(['+','-','*','/'].includes(e.key)) choose({'+':'+','-':'−','*':'×','/':'÷'}[e.key]);
   else if(e.key==='%') percent();
 });
 render();
})();
</script>
</body>
</html>
